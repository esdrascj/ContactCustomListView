<template>
    <lightning-card variant="Narrow" class="custom-chat-card" icon-name="utility:agent_astro"
        title="Playbook AIssistant">

        <article class="slds-card">
            <div class="slds-grid slds-einstein-header slds-card__header">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-grid slds-grid_vertical-align-center slds-size_3-of-4 slds-medium-size_2-of-3">
                        <div class="slds-media__figure">
                            <span class="slds-icon_container slds-icon-utility-salesforce1">
                                <svg class="slds-icon slds-icon_small slds-icon-text-default" aria-hidden="true">
                                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#salesforce1"></use>
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="slds-einstein-header__figure slds-size_1-of-4 slds-medium-size_1-of-3"></div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-var-m-around_medium slds-grid slds-grid_vertical slds-box slds-theme_default">
                    <!-- Chat messages container -->
                    <div class="slds-scrollable_y" style="height: 440px" lwc:ref="chatContainer">
                        <!-- Iterate over each message in the messages array -->
                        <template for:each={messages} for:item="message">
                            <div key={message.id} class="slds-var-m-around_small">
                                <!-- If the message is from the user -->
                                <template lwc:if={message.isUser}>
                                    <div class="custom-chat-message_outbound slds-var-p-around_small">
                                        <div class="slds-chat-message__body">
                                            <div class="slds-chat-message__text">{message.text}</div>
                                        </div>
                                    </div>
                                </template>
                                <!-- If the message is from the assistant -->
                                <template lwc:else>
                                    <div class="custom-chat-message_inbound slds-var-p-around_small">
                                        <div class="slds-chat-message__body">
                                            <div class="slds-chat-message__text">{message.text}</div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <!-- Loading indicator -->
                        <template lwc:if={isLoading}>
                            <div class="loading-container slds-var-m-around_small">
                                <div class="loading-text">
                                    Processing your question… One moment.
                                </div>
                                <div class="loading-indicator"></div>
                            </div>
                        </template>
                    </div>
                    <!-- User input textarea -->
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-textarea class="custom-textarea slds-size_full" label="Type a message"
                            value={userMessage}
                            placeholder="Tá com alguma dúvida em qual processo executar? Pergunte aqui..."
                            onchange={handleInputChange} style="margin-bottom: 20px"></lightning-textarea>
                    </div>
                    <!-- Send button -->
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_1-of-4">
                            <lightning-button label="Enviar" variant="brand" onclick={handleSendMessage}
                                disabled={isLoading}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="slds-card__footer">
                <a class="slds-card__footer-action" href="#">Exportar conversa</a>
            </footer>
        </article>
    </lightning-card>
</template>
